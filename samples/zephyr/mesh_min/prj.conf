# Minimal MeshCore sample configuration.

# Pull in and build the MeshCore library.
CONFIG_MESHCORE=y
CONFIG_MESHCORE_ARDUINO_COMPAT=y
CONFIG_MESHCORE_ZEPHYR_HELPERS=y

# No persistent storage in this sample: the identity is volatile and regenerated
# on each boot. This is also what a board with no spare flash partition would use.
CONFIG_MESHCORE_STORAGE=n

# C++ runtime.
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Randomness for the RNG binding. XOSHIRO is the PRNG behind sys_rand_get() when
# no hardware entropy source is available (native_sim); CONFIG_TEST_RANDOM_GENERATOR
# was the old spelling and is gone in current Zephyr.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_XOSHIRO_RANDOM_GENERATOR=y

# Console / logging.
CONFIG_PRINTK=y
CONFIG_LOG=y

# Reasonable stack/heap headroom for the mesh engine.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
