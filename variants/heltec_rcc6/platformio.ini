[heltec_rcc6]
extends = esp32c6_base
board = heltec_rcc6
board_build.partitions = default_16MB.csv
upload_protocol = esptool
build_flags =
  ${esp32c6_base.build_flags}
  -I variants/heltec_rcc6
  -D HELTEC_RCC6=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D P_LORA_SCLK=21
  -D P_LORA_MISO=20
  -D P_LORA_MOSI=22
  -D P_LORA_NSS=23
  -D P_LORA_DIO_1=19
  -D P_LORA_BUSY=10
  -D P_LORA_RESET=8
  -D PIN_USER_BTN=9
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D PIN_ADC_CTRL=5
  -D ADC_CTRL_ENABLED=HIGH
  -D PIN_VBAT_READ=6
  -D ADC_MULTIPLIER=4.95f
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D DISABLE_WIFI_OTA=1
build_src_filter = ${esp32c6_base.build_src_filter}
  +<../variants/heltec_rcc6>
lib_deps =
  ${esp32c6_base.lib_deps}

[heltec_rcc6_with_display]
extends = heltec_rcc6
build_flags =
  ${heltec_rcc6.build_flags}
  -D HELTEC_RCC6_WITH_DISPLAY=1
  -D DISPLAY_CLASS=NV3001BDisplay
  -D NV3001B_USE_SOFTWARE_SPI=1
  -D NV3001B_USE_FAST_GPIO=1
  -D PIN_TFT_SCL=4
  -D PIN_TFT_SDA=15
  -D PIN_TFT_CS=18
  -D PIN_TFT_DC=3
  -D PIN_TFT_RST=0
  -D PIN_TFT_EN=2
  -D PIN_TFT_EN_ACTIVE=LOW
  -D PIN_TFT_BL=1
  -D PIN_TFT_BL_ACTIVE=HIGH
  -D DISPLAY_ROTATION=0
build_src_filter = ${heltec_rcc6.build_src_filter}
  +<helpers/ui/NV3001BDisplay.cpp>
lib_deps =
  ${heltec_rcc6.lib_deps}

[env:heltec_rcc6_without_display_repeater]
extends = heltec_rcc6
build_src_filter = ${heltec_rcc6.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${heltec_rcc6.build_flags}
  -D ADVERT_NAME='"heltec_rcc6 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
lib_deps =
  ${heltec_rcc6.lib_deps}
  ${esp32_ota.lib_deps}

[env:heltec_rcc6_without_display_room_server]
extends = heltec_rcc6
build_src_filter = ${heltec_rcc6.build_src_filter}
  +<../examples/simple_room_server>
build_flags =
  ${heltec_rcc6.build_flags}
  -D ADVERT_NAME='"heltec_rcc6 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
lib_deps =
  ${heltec_rcc6.lib_deps}
  ${esp32_ota.lib_deps}

[env:heltec_rcc6_without_display_companion_radio_ble]
extends = heltec_rcc6
build_flags =
  ${heltec_rcc6.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=NullDisplayDriver
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${heltec_rcc6.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${heltec_rcc6.lib_deps}
  densaugeo/base64 @ ~1.4.0

