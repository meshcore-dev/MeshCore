[WT32_ETH01_HT_RA62]
extends = esp32_base
board = wt32-eth01
build_flags =
  ${esp32_base.build_flags}
  -I variants/wt32_eth01
  -D P_LORA_SCLK=14
  -D P_LORA_MOSI=32
  -D P_LORA_MISO=35
  -D P_LORA_NSS=33
  -D P_LORA_RESET=4
  -D P_LORA_BUSY=36
  -D P_LORA_DIO_1=39
  ; Do not start I2C on GPIO32/33: they belong to LoRa.
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=8
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/wt32_eth01>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:WT32_ETH01_HT_RA62_companion_radio_ethernet]
extends = WT32_ETH01_HT_RA62
build_flags =
  ${WT32_ETH01_HT_RA62.build_flags}
  -D ETHERNET_ENABLED=1
  -D ETHERNET_USE_LAN8720=1
  -D ETHERNET_CLASS=LAN8720EthernetInterface
  -D ETHERNET_DEBUG_LOGGING=1
build_src_filter = ${WT32_ETH01_HT_RA62.build_src_filter}
  +<helpers/ethernet/SerialEthernetInterface.cpp>
  +<helpers/ethernet/lan8720/*.cpp>

[env:WT32_ETH01_HT_RA62_companion_radio_usb]
extends = WT32_ETH01_HT_RA62
build_flags =
  ${WT32_ETH01_HT_RA62.build_flags}
  -D ENABLE_USB_INTERFACE

[env:WT32_ETH01_HT_RA62_companion_radio_ble]
extends = WT32_ETH01_HT_RA62
board_build.partitions = min_spiffs.csv
build_flags =
  ${WT32_ETH01_HT_RA62.build_flags}
  -D BLE_PIN_CODE=123456
build_src_filter = ${WT32_ETH01_HT_RA62.build_src_filter}
  +<helpers/esp32/*.cpp>
