[Chatter2]
extends = esp32_base
board = esp32doit-devkit-v1
board_build.partitions = min_spiffs.csv
build_flags =
  ${esp32_base.build_flags}
  -D LORA_BW=125.0
  -D CHATTER2_SX1262_TCXO_VOLTAGE=1.8
  -I variants/chatter2
  -I src/helpers/ui
  -D CHATTER_2
  -D RADIO_CLASS=Chatter2Radio
  -D WRAPPER_CLASS=CustomLLCC68Wrapper
  -D P_LORA_NSS=14
  -D P_LORA_DIO_1=18
  -D P_LORA_RESET=RADIOLIB_NC
  -D P_LORA_BUSY=4
  -D P_LORA_SCLK=16
  -D P_LORA_MISO=17
  -D P_LORA_MOSI=5
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=0.0
  -D PIN_USER_BTN=36
  -D PIN_BUZZER=19
  -D PIN_VBAT_READ=34
  -D ADC_MULTIPLIER=5.0
  -D DISPLAY_CLASS=Chatter2Display
  -D UI_RECENT_LIST_SIZE=5
build_src_filter =
  ${esp32_base.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/sensors/EnvironmentSensorManager.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../variants/chatter2>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
  lovyan03/LovyanGFX @ ^1.2.7
  end2endzone/NonBlockingRTTTL @ ^1.3.0

[env:Chatter2_companion_radio_ble]
extends = Chatter2
build_flags =
  ${Chatter2.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D MESH_DEBUG=1

[env:Chatter2_companion_radio_usb]
extends = Chatter2
build_flags =
  ${Chatter2.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
