[diy_esp32_sx1262]

extends = esp32_base
board = esp32dev

build_flags =
  ${esp32_base.build_flags}

  ; ============================================================
  ; Variant
  ; ============================================================
  -I variants/diy_esp32_sx1262

  ; ============================================================
  ; ESP32 WROOM / SPI
  ; ============================================================
  -D P_LORA_SCLK=18
  -D P_LORA_MISO=19
  -D P_LORA_MOSI=23

  ; ============================================================
  ; SX1262
  ; ============================================================
  -D P_LORA_DIO_1=33
  -D P_LORA_NSS=5
  -D P_LORA_RESET=26
  -D P_LORA_BUSY=32

  ; ============================================================
  ; External RF switch
  ; ============================================================
  -D SX126X_TXEN=25
  -D SX126X_RXEN=13
  -D SX126X_DIO2_AS_RF_SWITCH=false

  ; ============================================================
  ; Radio
  ; ============================================================
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140


; ==============================================================
; Common MeshCore sources required by DIY ESP32
; ==============================================================

build_src_filter =

  ; Core sources
  +<*.cpp>

  ; ------------------------------------------------------------
  ; Generic MeshCore helpers
  ; ------------------------------------------------------------
  +<helpers/AdvertDataHelpers.cpp>
  +<helpers/ArduinoSerialInterface.cpp>
  +<helpers/AutoDiscoverRTCClock.cpp>
  +<helpers/RTC_RX8130CE.cpp>
  +<helpers/BaseChatMesh.cpp>
  +<helpers/ClientACL.cpp>
  +<helpers/CommonCLI.cpp>
  +<helpers/ConfigSerializer.cpp>
  +<helpers/ESP32Board.cpp>
  +<helpers/IdentityStore.cpp>
  +<helpers/RegionMap.cpp>
  +<helpers/StaticPoolPacketManager.cpp>
  +<helpers/TransportKeyStore.cpp>
  +<helpers/TxtDataHelpers.cpp>

  ; ------------------------------------------------------------
  ; Mesh bridges
  ; ------------------------------------------------------------
  +<helpers/bridges/BridgeBase.cpp>

  ; ------------------------------------------------------------
  ; RadioLib
  ; ------------------------------------------------------------
  +<helpers/radiolib/RadioLibWrappers.cpp>

  ; ------------------------------------------------------------
  ; DIY target
  ; ------------------------------------------------------------
  +<../variants/diy_esp32_sx1262/*.cpp>


; ==============================================================
; DIY ESP32 SX1262 REPEATER
; ==============================================================

[env:diy_esp32_sx1262_repeater]

extends = diy_esp32_sx1262

build_src_filter =
  ${diy_esp32_sx1262.build_src_filter}

  ; Simple Repeater
  +<../examples/simple_repeater/*.cpp>

build_flags =
  ${diy_esp32_sx1262.build_flags}

  ; Repeater identity
  -D ADVERT_NAME='"Esp32 Repeater"'

  ; No GPS
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0

  ; Admin password
  -D ADMIN_PASSWORD='"123456"'

  ; Neighbour table
  -D MAX_NEIGHBOURS=50

lib_deps =
  ${diy_esp32_sx1262.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0


; ==============================================================
; DIY ESP32 SX1262 COMPANION BLE
; ==============================================================

[env:diy_esp32_sx1262_companion_ble]

extends = diy_esp32_sx1262

board_build.partitions = partitions_diy_4mb.csv
board_upload.maximum_size = 2097152

build_src_filter =
  ${diy_esp32_sx1262.build_src_filter}

  ; Companion Radio
  +<../examples/companion_radio/*.cpp>

  ; ESP32 BLE only
  +<helpers/esp32/SerialBLEInterface.cpp>

build_flags =
  ${diy_esp32_sx1262.build_flags}

  ; Contacts
  -D MAX_CONTACTS=150

  ; Group channels
  -D MAX_GROUP_CHANNELS=30

  ; BLE PIN
  -D BLE_PIN_CODE=123456

  ; Offline queue
  -D OFFLINE_QUEUE_SIZE=128

lib_deps =
  ${diy_esp32_sx1262.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0
