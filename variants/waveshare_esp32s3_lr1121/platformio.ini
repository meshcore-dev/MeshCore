; Waveshare ESP32-S3-LR1121 (HF: 850-930 MHz + 2.4 GHz)
; ESP32-S3FH4R2 (4MB flash, 2MB PSRAM), native USB-CDC via the Tiny-Adapter FPC.
; No user LED, battery sense or user button (BOOT is GPIO0).
[Waveshare_S3_LR1121]
extends = esp32_base
board = esp32-s3-zero
; min_spiffs: 1.9MB OTA app slots; one layout for every role so switching roles keeps the filesystem
board_build.partitions = min_spiffs.csv
build_flags = ${esp32_base.build_flags}
  -I variants/waveshare_esp32s3_lr1121
  -D BOARD_HAS_PSRAM
  -D P_LORA_DIO_1=38
  -D P_LORA_NSS=42
  -D P_LORA_RESET=39
  -D P_LORA_BUSY=41
  -D P_LORA_SCLK=40
  -D P_LORA_MISO=46
  -D P_LORA_MOSI=45
  -D RADIO_CLASS=CustomLR1121
  -D WRAPPER_CLASS=CustomLR1121Wrapper
  -D LR11X0_DIO3_TCXO_VOLTAGE=1.8
  -D LR1121_FORCE_HP_PA   ; RFO_LP_LF is not fitted (R4 NC)
  -D RX_BOOSTED_GAIN=true
  -D LORA_TX_POWER=22
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/waveshare_esp32s3_lr1121>
lib_deps =
  ${esp32_base.lib_deps}

[env:Waveshare_S3_LR1121_repeater]
extends = Waveshare_S3_LR1121
build_flags =
  ${Waveshare_S3_LR1121.build_flags}
  -D ADVERT_NAME='"Waveshare LR1121 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Waveshare_S3_LR1121.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${Waveshare_S3_LR1121.lib_deps}
  ${esp32_ota.lib_deps}

[env:Waveshare_S3_LR1121_room_server]
extends = Waveshare_S3_LR1121
build_flags =
  ${Waveshare_S3_LR1121.build_flags}
  -D ADVERT_NAME='"Waveshare LR1121 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Waveshare_S3_LR1121.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${Waveshare_S3_LR1121.lib_deps}
  ${esp32_ota.lib_deps}

[env:Waveshare_S3_LR1121_companion_radio_usb]
extends = Waveshare_S3_LR1121
build_flags =
  ${Waveshare_S3_LR1121.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Waveshare_S3_LR1121.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${Waveshare_S3_LR1121.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Waveshare_S3_LR1121_companion_radio_ble]
extends = Waveshare_S3_LR1121
build_flags =
  ${Waveshare_S3_LR1121.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Waveshare_S3_LR1121.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${Waveshare_S3_LR1121.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Waveshare_S3_LR1121_kiss_modem]
extends = Waveshare_S3_LR1121
build_src_filter = ${Waveshare_S3_LR1121.build_src_filter}
  +<../examples/kiss_modem/>
