; iLabs Challenger RP2040 LoRa (1st generation, RFM95W / SX1276)
; Pins: arduino-pico variants/challenger_2040_lora/pins_arduino.h

[ilabs_challenger_2040_lora]
extends = rp2040_base
board = challenger_2040_lora
board_build.filesystem_size = 0.5m
; Lowest clock the board menu offers; cuts RP2040 current for battery (UPS) runtime
board_build.f_cpu = 50000000L
; RFM95W modules are band-specific; boot on the North American preset instead of the EU default
build_unflags =
  -D LORA_FREQ=869.618
  -D LORA_SF=8
build_flags = ${rp2040_base.build_flags}
  -I variants/ilabs_challenger_2040_lora
  -D SS=21 ; arduino-pico's challenger_2040_lora pins_arduino.h skips generic/common.h, so SS is missing (WiFi lib needs it)
  -D LORA_FREQ=910.525
  -D LORA_SF=7
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D SX127X_CURRENT_LIMIT=120
  -D LORA_TX_POWER=20
  -D P_LORA_DIO_0=14
  -D P_LORA_DIO_1=15
  -D P_LORA_NSS=9 ; CS
  -D P_LORA_RESET=13
  -D P_LORA_SCLK=10
  -D P_LORA_MISO=12
  -D P_LORA_MOSI=11
  -D P_LORA_TX_LED=24
  -D BOARD_LIGHT_SLEEP ; ChallengerBoard::sleep() is implemented, so 'powersaving on' is allowed
  -D PIN_BOARD_SDA=0
  -D PIN_BOARD_SCL=1
build_src_filter = ${rp2040_base.build_src_filter}
  +<../variants/ilabs_challenger_2040_lora>
lib_deps = ${rp2040_base.lib_deps}

[env:ilabs_challenger_2040_lora_repeater]
extends = ilabs_challenger_2040_lora
build_flags = ${ilabs_challenger_2040_lora.build_flags}
  -D ADVERT_NAME='"Challenger Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ilabs_challenger_2040_lora.build_src_filter}
  +<../examples/simple_repeater>

[env:ilabs_challenger_2040_lora_companion_radio_usb]
extends = ilabs_challenger_2040_lora
build_flags = ${ilabs_challenger_2040_lora.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${ilabs_challenger_2040_lora.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps = ${ilabs_challenger_2040_lora.lib_deps}
  densaugeo/base64 @ ~1.4.0
lib_ignore = BLE

[env:ilabs_challenger_2040_lora_terminal_chat]
extends = ilabs_challenger_2040_lora
build_flags = ${ilabs_challenger_2040_lora.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ilabs_challenger_2040_lora.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps = ${ilabs_challenger_2040_lora.lib_deps}
  densaugeo/base64 @ ~1.4.0
