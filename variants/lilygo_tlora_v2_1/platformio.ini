; LilyGo T-LoRa V2.1-1.6 MQTT observer targets (ttgo-lora32-v1, classic ESP32, no PSRAM):
; Use ONE active WSS broker preset at a time. Two concurrent TLS sessions usually exhaust
; contiguous internal heap; the second slot fails (mbedtls_ssl_setup / esp-tls 0x8017).
; Set extra slots to "none" (e.g. set mqtt2.preset none). See MQTT_IMPLEMENTATION.md.
; TEMPORARILY EXCLUDED FROM AUTOMATIC BUILDS (trailing underscore, same
; convention as the nibble_screen_connect envs). This board does not fit:
;   flex baseline (no webconfig, no upstream merge): 2,069,397 / 1,966,080 = 105.3%
; It has been silently failing on production for some time — the observer release
; ships 30 envs, not 32, and build.sh swallowing pio's exit code hid it. Dropping
; webconfig would recover only ~46 KB of a ~101 KB (flex) / ~242 KB (dev) deficit,
; so a NO_WEBCONFIG flag cannot rescue it. ESP32 (not S3), 4 MB flash, already on
; min_spiffs.csv. Real options: single-app partition (fits, but loses OTA), or
; trim ~250 KB for this board. See .scratch/tlora-v2-oversize.md.
[env:LilyGo_TLora_V2_1_1_6_repeater_observer_mqtt_]
extends = LilyGo_TLora_V2_1_1_6_core
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:scripts/generate_cert_bundle.py
board_ssl_cert_source = adafruit-full
board_build.embed_files = src/certs/x509_crt_bundle.bin
build_flags =
  ${LilyGo_TLora_V2_1_1_6_core.build_flags}
  -D ADVERT_NAME='"TLora-V2.1-1.6 MQTT Observer"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_MQTT_BRIDGE=1
  -D MQTT_MAX_PACKET_SIZE=1024
  -D MQTT_TASK_STACK_SIZE=16384
  -D ESP32_CPU_FREQ=240
;  -D MQTT_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
#  -D WIFI_SSID='"ssid"'
#  -D WIFI_PWD='"password"'
#  -D MQTT_SERVER='"your-mqtt-broker.com"'
#  -D MQTT_PORT=1883
#  -D MQTT_USERNAME='"your-username"'
#  -D MQTT_PASSWORD='"your-password"'
build_src_filter = ${LilyGo_TLora_V2_1_1_6_core.build_src_filter}
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/MQTTMessageBuilder.cpp>
  +<helpers/JWTHelper.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${LilyGo_TLora_V2_1_1_6_core.lib_deps}
  ${esp32_ota.lib_deps}
  elims/PsychicMqttClient@^0.2.4
  bblanchon/ArduinoJson @ 7.4.3
  arduino-libraries/NTPClient
  JChristensen/Timezone
  paulstoffregen/Time@1.6.1

; Same single-broker guidance as LilyGo_TLora_V2_1_1_6_repeater_observer_mqtt (see comment block above).
; TEMPORARILY EXCLUDED — see the repeater env above.
[env:LilyGo_TLora_V2_1_1_6_room_server_observer_mqtt_]
extends = LilyGo_TLora_V2_1_1_6_core
extra_scripts =
