; Raspberry Pi Pico W + Dragino LoRa shield (SX1276), wired to SPI0
;   SCK=GPIO18 MOSI=GPIO19 MISO=GPIO16 NSS=GPIO17 DIO0=GPIO6 DIO1=GPIO7 RST=GPIO8
; Optional NMEA GPS on UART0: Pico TX=GPIO12, RX=GPIO13
; PicoDraginoBoard extends WaveshareBoard from waveshare_rp2040_lora (same RP2040 board support)

[pico_w_dragino_sx1276]
extends = rp2040_base
board = rpipicow
board_build.filesystem_size = 0.5m
build_flags = ${rp2040_base.build_flags}
  -I variants/pico_w_dragino_sx1276
  -I variants/waveshare_rp2040_lora
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D SX127X_CURRENT_LIMIT=240
  -D LORA_TX_POWER=20
  -D P_LORA_DIO_0=6
  -D P_LORA_DIO_1=7
  -D P_LORA_RESET=8
  -D P_LORA_SCLK=18
  -D P_LORA_MISO=16
  -D P_LORA_MOSI=19
  -D P_LORA_NSS=17
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_TX=12
  -D PIN_GPS_RX=13
build_src_filter = ${rp2040_base.build_src_filter}
  +<../variants/pico_w_dragino_sx1276>
  +<../variants/waveshare_rp2040_lora/WaveshareBoard.cpp>
  +<helpers/sensors/EnvironmentSensorManager.cpp>
  +<helpers/sensors/MicroNMEALocationProvider.cpp>
lib_deps = ${rp2040_base.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6

[env:pico_w_dragino_repeater]
extends = pico_w_dragino_sx1276
build_flags = ${pico_w_dragino_sx1276.build_flags}
  -D ADVERT_NAME='"Pico W Dragino Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${pico_w_dragino_sx1276.build_src_filter}
  +<../examples/simple_repeater>

[env:pico_w_dragino_room_server]
extends = pico_w_dragino_sx1276
build_flags = ${pico_w_dragino_sx1276.build_flags}
  -D ADVERT_NAME='"Pico W Dragino Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${pico_w_dragino_sx1276.build_src_filter}
  +<../examples/simple_room_server>

[env:pico_w_dragino_companion_radio_usb]
extends = pico_w_dragino_sx1276
build_flags = ${pico_w_dragino_sx1276.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${pico_w_dragino_sx1276.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps = ${pico_w_dragino_sx1276.lib_deps}
  densaugeo/base64 @ ~1.4.0
lib_ignore = BLE

[env:pico_w_dragino_companion_radio_ble]
extends = pico_w_dragino_sx1276
build_flags = ${pico_w_dragino_sx1276.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
  -D BLE_PIN_CODE=123456
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${pico_w_dragino_sx1276.build_src_filter}
  +<helpers/rp2040/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps = ${pico_w_dragino_sx1276.lib_deps}
  densaugeo/base64 @ ~1.4.0
