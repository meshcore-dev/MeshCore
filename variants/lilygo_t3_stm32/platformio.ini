[lilygo_t3_stm32]
extends = stm32_base
board = lilygo_t3_stm32
board_upload.maximum_size = 229376 ; final 32 KiB reserved for InternalFS
build_flags = ${stm32_base.build_flags}
  -include variants/lilygo_t3_stm32/STM32ArduinoCompat.h
  -I variants/lilygo_t3_stm32
  -D RADIO_CLASS=CustomSTM32WLx
  -D WRAPPER_CLASS=CustomSTM32WLxWrapper
  -D LORA_TX_POWER=20
  -D SX126X_CURRENT_LIMIT=140
  -D RX_BOOSTED_GAIN=true
  -D STM32WL_TCXO_VOLTAGE=0 ; crystal oscillator; manufacturer sets IS_TCXO_SUPPORTED=0
  -D PIN_SERIAL_TX=PA9
  -D PIN_SERIAL_RX=PA10
  -D SERIAL_UART_INSTANCE=1
  -D PIN_SPI_SCK=PA5
  -D PIN_SPI_MISO=PA6
  -D PIN_SPI_MOSI=PA7
  -D PIN_OLED_CS=PB12
  -D PIN_OLED_DC=PA8
  -D PIN_OLED_RESET=-1
  -D PIN_USER_BTN=PH3
  -D USER_BTN_PRESSED=HIGH
  -D DISPLAY_CLASS=SSD1306Display
build_src_filter = ${stm32_base.build_src_filter}
  +<../variants/lilygo_t3_stm32>
  +<helpers/ui/SSD1306Display.cpp>
lib_deps = ${stm32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:LilyGo_T3_STM32_repeater]
extends = lilygo_t3_stm32
build_flags = ${lilygo_t3_stm32.build_flags}
  -D ADVERT_NAME='"T3 STM32 Repeater"'
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${lilygo_t3_stm32.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

[env:LilyGo_T3_STM32_companion_radio_usb]
extends = lilygo_t3_stm32
build_flags = ${lilygo_t3_stm32.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D ENABLE_USB_INTERFACE
build_src_filter = ${lilygo_t3_stm32.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps = ${lilygo_t3_stm32.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Optional INA219 telemetry on I2C1. Keep the base builds sensor-free.
[lilygo_t3_stm32_ina219]
build_flags =
  -D ENV_INCLUDE_INA219=1
  -D PIN_WIRE_SDA=PB7
  -D PIN_WIRE_SCL=PB8
build_src_filter =
  +<helpers/sensors/EnvironmentSensorManager.cpp>
lib_deps =
  adafruit/Adafruit INA219 @ ^1.2.3

[env:LilyGo_T3_STM32_repeater_ina219]
extends = env:LilyGo_T3_STM32_repeater
build_flags = ${env:LilyGo_T3_STM32_repeater.build_flags}
  ${lilygo_t3_stm32_ina219.build_flags}
build_src_filter = ${env:LilyGo_T3_STM32_repeater.build_src_filter}
  ${lilygo_t3_stm32_ina219.build_src_filter}
lib_deps = ${lilygo_t3_stm32.lib_deps}
  ${lilygo_t3_stm32_ina219.lib_deps}

[env:LilyGo_T3_STM32_companion_radio_usb_ina219]
extends = env:LilyGo_T3_STM32_companion_radio_usb
build_flags = ${env:LilyGo_T3_STM32_companion_radio_usb.build_flags}
  ${lilygo_t3_stm32_ina219.build_flags}
build_src_filter = ${env:LilyGo_T3_STM32_companion_radio_usb.build_src_filter}
  ${lilygo_t3_stm32_ina219.build_src_filter}
lib_deps = ${env:LilyGo_T3_STM32_companion_radio_usb.lib_deps}
  ${lilygo_t3_stm32_ina219.lib_deps}
