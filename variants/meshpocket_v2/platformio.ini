[meshpocket_v2]
extends = nrf52_base
board = meshpocket_v2
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${nrf52_base.build_flags}
  -I variants/meshpocket_v2
  -I src/helpers/nrf52
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -D HELTEC_MESH_POCKET_V2
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D DISPLAY_CLASS=NV3001BDisplay
  -D ENV_INCLUDE_GPS=1
  -D DISABLE_DIAGNOSTIC_OUTPUT
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/meshpocket_v2/*.cpp>
  +<helpers/sensors/EnvironmentSensorManager.cpp>
  +<helpers/ui/NV3001BDisplay.cpp>
lib_deps = ${nrf52_base.lib_deps}
  https://github.com/Quency-D/heltec-meshpocket-v2-power/releases/download/v0.2.0/HeltecMeshPocketV2Power-0.2.0.zip
  stevemarple/MicroNMEA @ ^2.0.6
  bakercp/CRC32 @ ^2.0.0
debug_tool = jlink
upload_protocol = nrfutil

[meshpocket_v2_companion]
extends = meshpocket_v2
build_flags = ${meshpocket_v2.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
build_src_filter = ${meshpocket_v2.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${meshpocket_v2.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:meshpocket_v2_companion_radio_ble]
extends = meshpocket_v2_companion
build_flags = ${meshpocket_v2_companion.build_flags}
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${meshpocket_v2_companion.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>

[env:meshpocket_v2_companion_radio_usb]
extends = meshpocket_v2_companion
build_flags = ${meshpocket_v2_companion.build_flags}
  -D ENABLE_USB_INTERFACE
  -D MESHPOCKET_V2_USB_SWITCHABLE

[env:meshpocket_v2_repeater]
extends = meshpocket_v2
build_flags = ${meshpocket_v2.build_flags}
  -D MESHPOCKET_V2_USB_SWITCHABLE
  -D ADVERT_NAME='"MeshPocket V2 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${meshpocket_v2.build_src_filter}
  +<../examples/simple_repeater>

[env:meshpocket_v2_room_server]
extends = meshpocket_v2
build_flags = ${meshpocket_v2.build_flags}
  -D MESHPOCKET_V2_USB_SWITCHABLE
  -D ADVERT_NAME='"MeshPocket V2 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${meshpocket_v2.build_src_filter}
  +<../examples/simple_room_server>
