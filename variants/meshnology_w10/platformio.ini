[meshnology_w10]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
build_flags =
  ${esp32_base.build_flags}
  -I variants/meshnology_w10
  -D MESHNOLOGY_W10
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=MeshnologyW10Radio
  -D P_LORA_SCLK=12
  -D P_LORA_MOSI=13
  -D P_LORA_MISO=11
  -D P_LORA_NSS=14
  ; Virtual pins 100..115 map to MCP23017 GPA0..GPB7 (EXPANDER_PIN_BASE in MCP23017.h).
  ; [env:native_w10] in the root platformio.ini mirrors P_LORA_DIO_1 and P_LORA_BUSY.
  -D P_LORA_RESET=103
  -D P_LORA_DIO_1=109
  -D P_LORA_BUSY=110
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=0.0f
  ; Match Meshtastic's SX1262 PA current limit; RadioLib defaults to 60 mA.
  -D SX126X_CURRENT_LIMIT=140
  -D LORA_TX_POWER=22
  -D MAX_LORA_TX_POWER=22
  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=7
  -D PIN_USER_BTN=0
  ; EnvironmentSensorManager names these from the GPS module's perspective.
  -D PIN_GPS_TX=44
  -D PIN_GPS_RX=43
  -D GPS_BAUD_RATE=9600
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_SHT4X=1
  ; Headless builds: remove DISPLAY_CLASS with build_unflags and exclude
  ; helpers/ui/ST7789LCDDisplay.cpp and companion_radio/ui-new/*.cpp from build_src_filter.
  -D DISPLAY_CLASS=ST7789LCDDisplay
  ; The panel shares the radio SPI bus (P_LORA_SCLK/MOSI/MISO); its reset is EXIO_LCD_RESET on the expander.
  -D PIN_TFT_CS=10
  -D PIN_TFT_DC=16
  -D PIN_TFT_RST=-1
  -D PIN_TFT_LEDA_CTL=6
  -D DISPLAY_WIDTH=240
  -D DISPLAY_HEIGHT=240
  -D DISPLAY_ROTATION=1
  -D DISPLAY_SCALE_X=1.875f
  -D DISPLAY_SCALE_Y=3.75f
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/meshnology_w10>
  +<helpers/sensors>
  +<helpers/ui/ST7789LCDDisplay.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  lewisxhe/XPowersLib @ ^0.2.7
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
  stevemarple/MicroNMEA @ ^2.0.6
  sensirion/Sensirion I2C SHT4x @ ^1.1.2

[env:meshnology_w10_companion_radio_usb]
extends = meshnology_w10
build_flags =
  ${meshnology_w10.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
build_src_filter = ${meshnology_w10.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${meshnology_w10.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:meshnology_w10_companion_radio_ble]
extends = meshnology_w10
build_flags =
  ${meshnology_w10.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456   ; random with display, fixed default without
build_src_filter = ${meshnology_w10.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<helpers/esp32/*.cpp>
lib_deps =
  ${meshnology_w10.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:meshnology_w10_repeater]
extends = meshnology_w10
build_flags =
  ${meshnology_w10.build_flags}
  -D ADVERT_NAME='"Meshnology W10 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${meshnology_w10.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${meshnology_w10.lib_deps}
  ${esp32_ota.lib_deps}

[env:meshnology_w10_room_server]
extends = meshnology_w10
build_flags =
  ${meshnology_w10.build_flags}
  -D ADVERT_NAME='"Meshnology W10 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${meshnology_w10.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${meshnology_w10.lib_deps}
  ${esp32_ota.lib_deps}
