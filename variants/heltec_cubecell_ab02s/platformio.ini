; Heltec CubeCell GPS-6502 (HTCC-AB02S) - LEGACY board: ASR6502 (Cortex-M0+), 128 KB flash, 16 KB RAM, fixed 2 KB stack.
; Companion over USB/UART only (no BLE, no WiFi). The node does not generate its own identity: import a private key
; from the app first; until then it answers the app but never transmits.
; Small-board options used here (all default off elsewhere): see the build_flags below.

[heltec_cubecell_ab02s]
extends = arduino_base
platform = heltecautomation/heltec-cubecell@1.1.0
board = cubecell_gps
extra_scripts = pre:variants/heltec_cubecell_ab02s/c_include_order.py
build_unflags = -std=gnu++98 -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags = ${arduino_base.build_flags}
  -std=gnu++11 -fno-exceptions
  -D ASR650X_PLATFORM
  -I src/helpers/asr650x
  -I variants/heltec_cubecell_ab02s
  -I variants/heltec_cubecell_ab02s/shims
  -I examples/companion_radio
  -D ENABLE_PRIVATE_KEY_EXPORT=0
  -D LORA_TX_POWER=14
  -D MAX_CONTACTS=12
  -D OFFLINE_QUEUE_SIZE=3
  -D MAX_GROUP_CHANNELS=1
  -D MAX_ANON_CONTACTS=2
  -D MAX_PACKET_HASHES=32
  -D ADVERT_PATH_TABLE_SIZE=4
  -D COMPANION_PACKET_POOL_SIZE=5
  -D CONTACT_OUT_PATH_SIZE=16
  -D RX_DELAY_FAST_POW
  -D DISABLE_CLI_RESCUE
  -D DISABLE_COMPANION_CLI
  -D SERIAL_FRAME_STRICT
  -D CONTACT_PIN_STORE
  -D CONFIG_SERIALIZER_NOOP
  -D ED25519_SMALL_BASE_TABLE
  -D IDENTITY_CRYPTO_ON_BIG_STACK
  -D BIGSTACK_SIZE=2048
  -D ENV_INCLUDE_GPS=1
  ; the framework printf (mpaland) is built with these: nothing here prints %f/%e/%g/%ll (floats go through StrHelper::ftoa)
  -D PRINTF_DISABLE_SUPPORT_FLOAT
  -D PRINTF_DISABLE_SUPPORT_EXPONENTIAL
  -D PRINTF_DISABLE_SUPPORT_LONG_LONG
; only the helpers a companion needs: the others expect a filesystem
build_src_filter =
  +<*.cpp>
  +<helpers/AdvertDataHelpers.cpp>
  +<helpers/ArduinoSerialInterface.cpp>
  +<helpers/BaseChatMesh.cpp>
  +<helpers/CommonRadioPrefs.cpp>
  +<helpers/ConfigSerializer.cpp>
  +<helpers/DynamicConfigSerializer.cpp>
  +<helpers/StaticPoolPacketManager.cpp>
  +<helpers/TransportKeyStore.cpp>
  +<helpers/TxtDataHelpers.cpp>
  +<helpers/asr650x/*.cpp>
  +<../variants/heltec_cubecell_ab02s/*.cpp>
lib_deps =
  rweather/Crypto @ ^0.4.0
  densaugeo/base64 @ ~1.4.0
lib_ignore =
  RadioLib
  RTClib
  Melopero RV3028
  CayenneLPP

[env:Heltec_CubeCell_AB02S_companion_radio_usb]
extends = heltec_cubecell_ab02s
build_flags = ${heltec_cubecell_ab02s.build_flags}
  -D ENABLE_USB_INTERFACE
build_src_filter = ${heltec_cubecell_ab02s.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  -<../examples/companion_radio/DataStore.cpp>
