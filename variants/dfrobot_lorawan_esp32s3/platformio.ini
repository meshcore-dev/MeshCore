; DFRobot LoRaWAN ESP32-S3 (DFR1195)
; ESP32-S3-WROOM-1-N4 (4 MB flash, no PSRAM), SX1262, SPI ST7735S 80x160.
; Pin map follows variants/esp32s3/DFRobot_LoRaWAN_ESP32-S3 in the Meshtastic tree.
; LoRa is on FSPI. The display is on HSPI (SPI3), matching ST7735_SPI_HOST.
[DFRobot_LoRaWAN_ESP32S3]
extends = esp32_base
board = dfrobot_lorawan_esp32s3
; 4 MB module: app slots are 1.9 MB. The default 4 MB table only leaves 1.25 MB.
board_build.partitions = min_spiffs.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/dfrobot_lorawan_esp32s3
  -D DFROBOT_LORAWAN_ESP32S3
  -D ESP32_CPU_FREQ=80
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_NSS=10
  -D P_LORA_DIO_1=4
  -D P_LORA_RESET=41
  -D P_LORA_BUSY=40
  -D P_LORA_SCLK=7
  -D P_LORA_MISO=5
  -D P_LORA_MOSI=6
  -D LORA_POWER_EN=42
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=3.3
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_USER_BTN=18
  -D PIN_LED=21
  -D PIN_VEXT_EN=48
  -D PIN_VEXT_EN_ACTIVE=LOW
  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=9
  -D PIN_TFT_CS=17
  -D PIN_TFT_DC=14
  -D PIN_TFT_RST=15
  -D PIN_TFT_SDA=11
  -D PIN_TFT_SCL=12
  -D PIN_TFT_LEDA_CTL=16
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/dfrobot_lorawan_esp32s3>
lib_deps =
  ${esp32_base.lib_deps}
  bodmer/TFT_eSPI @ ^2.4.31

; Landscape UI on the 80x160 panel. Use 3 if the picture is upside down.
[env:DFRobot_LoRaWAN_ESP32S3_companion_radio_ble]
extends = DFRobot_LoRaWAN_ESP32S3
build_flags =
  ${DFRobot_LoRaWAN_ESP32S3.build_flags}
  -I src/helpers/ui
  -I examples/companion_radio/ui-new
  -D DISPLAY_ROTATION=3
  -D DISPLAY_CLASS=ST7735Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${DFRobot_LoRaWAN_ESP32S3.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/ST7735Display.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${DFRobot_LoRaWAN_ESP32S3.lib_deps}
  densaugeo/base64 @ ~1.4.0
