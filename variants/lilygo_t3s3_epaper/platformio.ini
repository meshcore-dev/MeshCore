[LilyGo_T3S3_epaper]
extends = esp32_base
board = t3_s3_v1_x
build_flags =
  ${esp32_base.build_flags}
  -I variants/lilygo_t3s3_epaper
  -D LILYGO_T3S3_EPAPER
  -D P_LORA_DIO_1=33
  -D P_LORA_NSS=7
  -D P_LORA_RESET=8   ; RADIOLIB_NC
  -D P_LORA_BUSY=34
  -D P_LORA_SCLK=5
  -D P_LORA_MISO=3
  -D P_LORA_MOSI=6
  -D P_LORA_TX_LED=37
  -D PIN_VBAT_READ=1
  -D PIN_USER_BTN=0
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_DISPLAY_MISO=-1
  -D PIN_DISPLAY_MOSI=11
  -D PIN_DISPLAY_SCLK=14
  -D PIN_DISPLAY_CS=15
  -D PIN_DISPLAY_DC=16
  -D PIN_DISPLAY_RST=47
  -D PIN_DISPLAY_BUSY=48
  -D DISPLAY_CLASS=GxEPDDisplay
  -D EINK_DISPLAY_MODEL=GxEPD2_213_BN
  -D EINK_SCALE_X=1.953125f
  -D EINK_SCALE_Y=1.28f
  -D EINK_X_OFFSET=0
  -D EINK_Y_OFFSET=10
  -D DISPLAY_ROTATION=3
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_t3s3_epaper>
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  zinggjm/GxEPD2 @ 1.6.2
  bakercp/CRC32 @ ^2.0.0

; === LilyGo T3S3 e-paper environments ===
[env:LilyGo_T3S3_epaper_repeater]
extends = LilyGo_T3S3_epaper
build_flags =
  ${LilyGo_T3S3_epaper.build_flags}
  -D ADVERT_NAME='"T3S3-Epaper Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_T3S3_epaper.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${LilyGo_T3S3_epaper.lib_deps}
  ${esp32_ota.lib_deps}

[env:LilyGo_T3S3_epaper_room_server]
extends = LilyGo_T3S3_epaper
build_flags =
  ${LilyGo_T3S3_epaper.build_flags}
  -D ADVERT_NAME='"T3S3-Epaper Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_T3S3_epaper.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${LilyGo_T3S3_epaper.lib_deps}
  ${esp32_ota.lib_deps}

[env:LilyGo_T3S3_epaper_companion_radio_usb]
extends = LilyGo_T3S3_epaper
build_flags =
  ${LilyGo_T3S3_epaper.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_T3S3_epaper.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_T3S3_epaper.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_T3S3_epaper_companion_radio_ble]
extends = LilyGo_T3S3_epaper
build_flags =
  ${LilyGo_T3S3_epaper.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_T3S3_epaper.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_T3S3_epaper.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_T3S3_epaper_terminal_chat]
extends = LilyGo_T3S3_epaper
build_flags =
  ${LilyGo_T3S3_epaper.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_T3S3_epaper.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${LilyGo_T3S3_epaper.lib_deps}
  densaugeo/base64 @ ~1.4.0
