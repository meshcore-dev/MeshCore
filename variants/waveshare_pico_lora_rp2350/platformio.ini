; Waveshare Pico-LoRa-SX1262 (SX1262 LoRa HAT) + Raspberry Pi Pico 2 (RP2350)
; https://www.waveshare.com/wiki/Pico-LoRa-SX1262
;
; Base board is the plain Pico 2: repeater / room server / terminal chat /
; kiss modem / USB companion radio have no wireless and run on non-W boards.
; The BLE companion-radio env overrides to rpipico2w (Pico 2 W, CYW43).

[waveshare_pico_lora_rp2350]
extends = rp2350_base
board = rpipico2
board_build.filesystem_size = 0.5m
build_flags = ${rp2350_base.build_flags}
  ${sensor_base.build_flags}
  ; GPS on Serial1 (HW UART0); PIN_GPS_TX is the CPU RX pin, PIN_GPS_RX the CPU TX pin.
  ; RP2350 UART pads are parity-fixed (UART0: TX even / RX odd GPIO); a mismatched
  ; pair makes the core panic() at boot. Uses UART0's default pads GP0/GP1, which
  ; are free on this HAT; add -UENV_INCLUDE_GPS to disable
  -D PIN_GPS_TX=1
  -D PIN_GPS_RX=0
  ; No GPS on the HAT: skip the boot-time detection poll; the 'gps' setting is
  ; still exposed and stays off until enabled with 'gps on'
  -D ENV_SKIP_GPS_DETECT=1
  -I variants/waveshare_pico_lora_rp2350
  ; I2C0 for sensors/RTC: Pico default GP4 (SDA) / GP5 (SCL), override to remap
  -D PIN_BOARD_SDA=4
  -D PIN_BOARD_SCL=5
  -D SX126X_CURRENT_LIMIT=130
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=20
  -D P_LORA_NSS=3 ; CS
  -D P_LORA_RESET=15
  -D P_LORA_BUSY=2
  -D P_LORA_SCLK=10
  -D P_LORA_MISO=12
  -D P_LORA_MOSI=11
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
; Debug options
  ; -D DEBUG_RP2040_WIRE=1
  ; -D DEBUG_RP2040_SPI=1
  ; -D DEBUG_RP2040_CORE=1
  ; -D RADIOLIB_DEBUG_SPI=1
  ; -D DEBUG_RP2040_PORT=Serial
build_src_filter = ${rp2350_base.build_src_filter}
  +<PicoLoRaBoard.cpp>
  +<../variants/waveshare_pico_lora_rp2350>
  +<helpers/sensors>
lib_deps =
  ${rp2350_base.lib_deps}
  ${sensor_base.lib_deps}

[env:waveshare_pico_lora_rp2350_repeater]
extends = waveshare_pico_lora_rp2350
build_flags = ${waveshare_pico_lora_rp2350.build_flags}
  -D ADVERT_NAME='"Pico2-LoRa Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${waveshare_pico_lora_rp2350.build_src_filter}
  +<../examples/simple_repeater>

[env:waveshare_pico_lora_rp2350_room_server]
extends = waveshare_pico_lora_rp2350
build_flags = ${waveshare_pico_lora_rp2350.build_flags}
  -D ADVERT_NAME='"Pico2-LoRa Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${waveshare_pico_lora_rp2350.build_src_filter}
  +<../examples/simple_room_server>

[env:waveshare_pico_lora_rp2350_terminal_chat]
extends = waveshare_pico_lora_rp2350
build_flags = ${waveshare_pico_lora_rp2350.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${waveshare_pico_lora_rp2350.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps = ${waveshare_pico_lora_rp2350.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:waveshare_pico_lora_rp2350_kiss_modem]
extends = waveshare_pico_lora_rp2350
build_src_filter = ${waveshare_pico_lora_rp2350.build_src_filter}
  +<../examples/kiss_modem/>

[env:waveshare_pico_lora_rp2350_companion_radio_usb]
extends = waveshare_pico_lora_rp2350
build_flags = ${waveshare_pico_lora_rp2350.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${waveshare_pico_lora_rp2350.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps = ${waveshare_pico_lora_rp2350.lib_deps}
  densaugeo/base64 @ ~1.4.0
lib_ignore = BLE

; --- Pico 2 W (CYW43) roles: BLE / WiFi need the wireless radio ---

[env:waveshare_pico_lora_rp2350_companion_radio_ble]
extends = waveshare_pico_lora_rp2350
board = rpipico2w
build_flags = ${waveshare_pico_lora_rp2350.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  ; USB serial + BLE enabled together: the companion is reachable over both
  -D ENABLE_USB_INTERFACE
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
  -D BLE_PIN_CODE=123456
; ;  -D MESH_PACKET_LOGGING=1
; ;  -D MESH_DEBUG=1
build_src_filter = ${waveshare_pico_lora_rp2350.build_src_filter}
  +<helpers/rp2040/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps = ${waveshare_pico_lora_rp2350.lib_deps}
  densaugeo/base64 @ ~1.4.0

