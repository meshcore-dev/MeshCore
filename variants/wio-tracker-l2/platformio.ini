; Seeed Wio Tracker L2 Pro (alpha) - Wio-S3 module: ESP32-S3R8 + SX1262
; Pin map derived from Seeed's Meshtastic support branch (meshtastic/firmware
; PR #10909 + device-ui `wio-l2` branch).
[Wio_Tracker_L2]
extends = esp32_base
board = seeed_wio_tracker_l2
build_flags = ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/wio-tracker-l2
  -D SEEED_WIO_TRACKER_L2
  -D PIN_BOARD_SDA=47
  -D PIN_BOARD_SCL=48
  -D PIN_USER_BTN=0
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_NSS=21
  -D P_LORA_RESET=7
  -D P_LORA_BUSY=8
  -D P_LORA_DIO_1=9
  -D P_LORA_SCLK=4
  -D P_LORA_MISO=5
  -D P_LORA_MOSI=6
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_TX=18 ; L76K TX -> ESP32 RX
  -D PIN_GPS_RX=17 ; L76K RX <- ESP32 TX
  -D GPS_BAUD_RATE=9600
  -D ENV_SKIP_GPS_DETECT=1 ; GPS is always present, powered via IO expander
  -D DISPLAY_CLASS=WioTrackerL2Display
  -D UI_ZOOM=2
  ; disable ALL env sensor I2C probes: this bus carries six onboard chips
  ; (TCA9535 0x21, AW35615 0x22, LP5814 0x2C, ADS1115 0x48, GT911 0x5D,
  ;  ES8311 0x18) and stray probe matches can hang sensors.begin()
  -D ENV_INCLUDE_AHTX0=0
  -D ENV_INCLUDE_BME280=0
  -D ENV_INCLUDE_BMP280=0
  -D ENV_INCLUDE_SHTC3=0
  -D ENV_INCLUDE_SHT4X=0
  -D ENV_INCLUDE_INA3221=0
  -D ENV_INCLUDE_INA219=0
  -D ENV_INCLUDE_INA226=0
  -D ENV_INCLUDE_INA260=0
  -D ENV_INCLUDE_MLX90614=0
  -D ENV_INCLUDE_VL53L0X=0
  -D ENV_INCLUDE_BME680=0
  -D ENV_INCLUDE_BMP085=0
  -D ENV_INCLUDE_LPS22HB=0
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/wio-tracker-l2>
  +<helpers/sensors/*.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.25
  https://github.com/pschatzmann/arduino-audio-driver/archive/v0.2.1.zip

; -------- Companion: BLE phone app + standalone touch UI --------------------
[env:Wio_Tracker_L2_companion_radio_ble]
extends = Wio_Tracker_L2
build_flags =
  ${Wio_Tracker_L2.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D HAS_TOUCH=1
  -D AUTO_OFF_MILLIS=60000 ; LCD, no burn-in worry; 1 min screen timeout
build_src_filter = ${Wio_Tracker_L2.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Wio_Tracker_L2.lib_deps}
  densaugeo/base64 @ ~1.4.0

; -------- Companion: USB serial link + standalone touch UI ------------------
[env:Wio_Tracker_L2_companion_radio_usb]
extends = Wio_Tracker_L2
build_flags =
  ${Wio_Tracker_L2.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
  -D HAS_TOUCH=1
  -D AUTO_OFF_MILLIS=60000
build_src_filter = ${Wio_Tracker_L2.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Wio_Tracker_L2.lib_deps}
  densaugeo/base64 @ ~1.4.0

; -------- Companion: BLE + full LVGL touch UI (next-gen interface) ----------
[Wio_Tracker_L2_lvgl]
extends = Wio_Tracker_L2
build_flags =
  ${Wio_Tracker_L2.build_flags}
  -I examples/companion_radio/ui-lvgl
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D AUTO_OFF_MILLIS=60000
  -D LV_CONF_SKIP=1
  -D LV_COLOR_DEPTH=16
  -D LV_FONT_MONTSERRAT_12=1
  -D LV_FONT_MONTSERRAT_14=1
  -D LV_FONT_MONTSERRAT_16=1
  -D LV_FONT_MONTSERRAT_28=1 ; splash title
  ; emoji font support (default font is set via the theme in UITask.cpp)
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D UI_LVGL=1 ; suppress main.cpp 'Loading...' banner - LVGL splash instead
  -D CHAT_STORE_SIZE=120 ; message history depth (persisted to SPIFFS)
  ; map tiles: PNG decode + POSIX FS (ESP32 VFS -> /sdcard) + decoded-image cache
  -D LV_USE_LODEPNG=1
  -D LV_USE_FS_POSIX=1
  -D LV_FS_POSIX_LETTER=65
  -D LV_FS_POSIX_PATH='"/sdcard"'
  -D LV_CACHE_DEF_SIZE=2097152
  ; all LVGL memory in one PSRAM pool: internal RAM stays free for BT/SD bursts
  -D LV_USE_STDLIB_MALLOC=LV_STDLIB_BUILTIN
  -D LV_MEM_SIZE=3670016
  -D LV_MEM_ADR=0
  -D LV_MEM_POOL_INCLUDE='"lv_psram_pool.h"'
  -D LV_MEM_POOL_ALLOC=lv_psram_pool_alloc
build_src_filter = ${Wio_Tracker_L2.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-lvgl/*.cpp>
lib_deps =
  ${Wio_Tracker_L2.lib_deps}
  densaugeo/base64 @ ~1.4.0
  lvgl/lvgl @ 9.2.2   ; pinned: UI is validated against this exact release

; Standalone: full touch UI, no Bluetooth (USB CLI only). The BLE companion
; builds use the standard display UI instead - with a phone attached, the
; phone is the interface. STANDALONE_NO_BT compiles out the BT settings rows.
[env:Wio_Tracker_L2_standalone_lvgl]
extends = Wio_Tracker_L2_lvgl
build_flags =
  ${Wio_Tracker_L2_lvgl.build_flags}
  -D ENABLE_USB_INTERFACE
  -D STANDALONE_NO_BT=1
build_src_filter = ${Wio_Tracker_L2_lvgl.build_src_filter}
  -<helpers/esp32/SerialBLEInterface.cpp>

; -------- Standalone repeater: extends mesh coverage, no phone needed -------
[env:Wio_Tracker_L2_repeater]
extends = Wio_Tracker_L2
build_flags =
  ${Wio_Tracker_L2.build_flags}
  -D ADVERT_NAME='"WioL2 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${Wio_Tracker_L2.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${Wio_Tracker_L2.lib_deps}
  ${esp32_ota.lib_deps}

; -------- Standalone room server: shared message board / BBS ----------------
[env:Wio_Tracker_L2_room_server]
extends = Wio_Tracker_L2
build_flags =
  ${Wio_Tracker_L2.build_flags}
  -D ADVERT_NAME='"WioL2 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${Wio_Tracker_L2.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${Wio_Tracker_L2.lib_deps}
  ${esp32_ota.lib_deps}
