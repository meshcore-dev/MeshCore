[heltec_rc52]
extends = nrf52_base
board = heltec-rc52
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -I variants/heltec_rc52
  -I src/helpers/ui
  -D HELTEC_RC52
  -D NRF52_POWER_MANAGEMENT
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=11
  -D P_LORA_NSS=13
  -D P_LORA_RESET=32
  -D P_LORA_BUSY=24
  -D P_LORA_SCLK=25
  -D P_LORA_MISO=14
  -D P_LORA_MOSI=22
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/heltec_rc52>
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
debug_tool = jlink
upload_protocol = nrfutil

[env:heltec_rc52_without_display_repeater]
extends = heltec_rc52
build_src_filter = ${heltec_rc52.build_src_filter}
  +<../examples/simple_repeater>
build_flags =
  ${heltec_rc52.build_flags}
  -D ADVERT_NAME='"Heltec RC52 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50

[env:heltec_rc52_without_display_room_server]
extends = heltec_rc52
build_src_filter = ${heltec_rc52.build_src_filter}
  +<../examples/simple_room_server>
build_flags =
  ${heltec_rc52.build_flags}
  -D ADVERT_NAME='"Heltec RC52 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'

[env:heltec_rc52_without_display_companion_radio_ble]
extends = heltec_rc52
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${heltec_rc52.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=NullDisplayDriver
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${heltec_rc52.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${heltec_rc52.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:heltec_rc52_without_display_companion_radio_usb]
extends = heltec_rc52
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${heltec_rc52.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=NullDisplayDriver
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
build_src_filter = ${heltec_rc52.build_src_filter}
  +<helpers/nrf52/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${heltec_rc52.lib_deps}
  densaugeo/base64 @ ~1.4.0

;
; Heltec RC52 with NV3001B display
;
[heltec_rc52_with_display]
extends = heltec_rc52
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags =
  ${heltec_rc52.build_flags}
  -D HELTEC_RC52_WITH_DISPLAY
  -D DISPLAY_CLASS=NV3001BDisplay
build_src_filter = ${heltec_rc52.build_src_filter}
  +<helpers/ui/NV3001BDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${heltec_rc52.lib_deps}

[env:heltec_rc52_repeater]
extends = heltec_rc52_with_display
build_src_filter = ${heltec_rc52_with_display.build_src_filter}
  +<../examples/simple_repeater>
build_flags =
  ${heltec_rc52_with_display.build_flags}
  -D ADVERT_NAME='"Heltec RC52 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50

[env:heltec_rc52_room_server]
extends = heltec_rc52_with_display
build_src_filter = ${heltec_rc52_with_display.build_src_filter}
  +<../examples/simple_room_server>
build_flags =
  ${heltec_rc52_with_display.build_flags}
  -D ADVERT_NAME='"Heltec RC52 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'

[env:heltec_rc52_companion_radio_ble]
extends = heltec_rc52_with_display
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${heltec_rc52_with_display.build_flags}
  -I examples/companion_radio/ui-new
  -D PIN_BUZZER=5
  -D UI_HAS_ROTARY_INPUT
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D ENV_INCLUDE_GPS=1
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${heltec_rc52_with_display.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${heltec_rc52_with_display.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

[env:heltec_rc52_companion_radio_usb]
extends = heltec_rc52_with_display
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${heltec_rc52_with_display.build_flags}
  -I examples/companion_radio/ui-new
  -D PIN_BUZZER=5
  -D UI_HAS_ROTARY_INPUT
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENV_INCLUDE_GPS=1
build_src_filter = ${heltec_rc52_with_display.build_src_filter}
  +<helpers/nrf52/*.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${heltec_rc52_with_display.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

[env:heltec_rc52_kiss_modem]
extends = heltec_rc52
build_src_filter = ${heltec_rc52.build_src_filter}
  +<../examples/kiss_modem/>
