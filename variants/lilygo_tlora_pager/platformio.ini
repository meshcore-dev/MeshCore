[LilyGo_TLoRa_Pager]
extends = esp32_base
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/lilygo_tlora_pager
  -I src/helpers/ui/companion-new
  -D LILYGO_TLORA_PAGER
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PIN_BOARD_SDA=3
  -D PIN_BOARD_SCL=2
  -D PIN_USER_BTN=7
  -D PIN_TFT_RST=-1
  -D PIN_TFT_LEDA_CTL=42
  -D PIN_TFT_DC=37
  -D PIN_TFT_CS=38
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D DISPLAY_ROTATION=3
  -D DISPLAY_SCALE_X=3.75f
  -D DISPLAY_SCALE_Y=3.46875f
  -D P_LORA_SCLK=35
  -D P_LORA_MOSI=34
  -D P_LORA_MISO=33
  -D P_LORA_NSS=36
  -D P_LORA_DIO_1=14
  -D P_LORA_RESET=47
  -D P_LORA_BUSY=48
  -D LORA_TX_POWER=22
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_RX=12
  -D PIN_GPS_TX=4
  -D GPS_BAUD_RATE=38400
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_tlora_pager/>
  +<helpers/esp32/*.cpp>
  +<helpers/sensors/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/ST7789LCDDisplay.cpp>
  +<../examples/companion_radio/*.cpp>
  +<helpers/ui/companion-new>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.12.0
  densaugeo/base64 @ ~1.4.0

[LilyGo_TLoRa_Pager_SX1262]
extends = LilyGo_TLoRa_Pager
build_flags = ${LilyGo_TLoRa_Pager.build_flags}
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1

[LilyGo_TLoRa_Pager_LR1121]
extends = LilyGo_TLoRa_Pager
build_flags = ${LilyGo_TLoRa_Pager.build_flags}
  -D USE_LR1121
  -D RADIO_CLASS=CustomLR1121
  -D WRAPPER_CLASS=CustomLR1121Wrapper

[env:LilyGo_TLoRa_Pager_SX1262_companion_radio_usb]
extends = LilyGo_TLoRa_Pager_SX1262
build_flags = ${LilyGo_TLoRa_Pager_SX1262.build_flags}
  -D ENABLE_USB_INTERFACE

[env:LilyGo_TLoRa_Pager_SX1262_companion_radio_ble]
extends = LilyGo_TLoRa_Pager_SX1262
build_flags = ${LilyGo_TLoRa_Pager_SX1262.build_flags}
  -D BLE_PIN_CODE=123456

[env:LilyGo_TLoRa_Pager_LR1121_companion_radio_usb]
extends = LilyGo_TLoRa_Pager_LR1121
build_flags = ${LilyGo_TLoRa_Pager_LR1121.build_flags}
  -D ENABLE_USB_INTERFACE

[env:LilyGo_TLoRa_Pager_LR1121_companion_radio_ble]
extends = LilyGo_TLoRa_Pager_LR1121
build_flags = ${LilyGo_TLoRa_Pager_LR1121.build_flags}
  -D BLE_PIN_CODE=123456
