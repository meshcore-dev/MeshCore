[SenseCap_Solar]
extends = nrf52_base
board = seeed_sensecap_solar
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/sensecap_solar
  -I src/helpers/nrf52
  -D NRF52_PLATFORM=1
  -D USE_SX1262
  -D NRF52_POWER_MANAGEMENT
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_TX_LED=12
  -D P_LORA_DIO_1=1
  -D P_LORA_RESET=2
  -D P_LORA_BUSY=3
  -D P_LORA_NSS=4
  -D PIN_USER_BTN=PIN_BUTTON1
  -D LORA_TX_POWER=22
  -D SX126X_RXEN=5
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D ENV_INCLUDE_GPS=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/sensecap_solar>
debug_tool = jlink
upload_protocol = nrfutil
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}

[env:SenseCap_Solar_repeater]
extends = SenseCap_Solar
build_flags =
  ${SenseCap_Solar.build_flags}
  -D ADVERT_NAME='"SenseCap_Solar Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${SenseCap_Solar.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

; Slim repeater: no GPS/external sensor drivers (MCU temperature only), no BLE stack. Extends the shared
; rak4631_hw OTA recipe. S140 v7.3.0 app region starts at 0x27000 (not 0x26000) — override APP_BASE so
; EndF scan / staging headroom match the linker script.
[env:SenseCap_Solar_repeater_slim]
extends = rak4631_hw
board = seeed_sensecap_solar
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${rak4631_hw.build_flags}
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/sensecap_solar
  -I src/helpers/nrf52
  -D NRF52_PLATFORM=1
  -D MOTA_NRF52_APP_BASE=0x00027000u
  -D MOTA_HW_ID='"SenseCap_Solar"'
  -D USE_SX1262
  -D NRF52_POWER_MANAGEMENT
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_TX_LED=12
  -D P_LORA_DIO_1=1
  -D P_LORA_RESET=2
  -D P_LORA_BUSY=3
  -D P_LORA_NSS=4
  -D PIN_USER_BTN=PIN_BUTTON1
  -D LORA_TX_POWER=22
  -D SX126X_RXEN=5
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D MOTA_STAGE_CEILING=0xED000
  -D BLE_DFU_DISABLED
  -D ADVERT_NAME='"SenseCap P1-Pro Slim Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${rak4631_hw.build_src_filter}
  +<helpers/sensors>
  +<../variants/sensecap_solar>
  +<../examples/simple_repeater>
lib_deps = ${rak4631_hw.lib_deps}
debug_tool = jlink
upload_protocol = nrfutil

; NOR-backed mini-superseeder: SenseCAP P1-Pro slim + onboard 2 MB QSPI (P25Q16H) as LittleFS.
; Captures allowlisted *deltas* only to /motas/; flash staging remains for self-update.
[env:SenseCap_Solar_superseeder]
extends = env:SenseCap_Solar_repeater_slim
build_flags =
  ${env:SenseCap_Solar_repeater_slim.build_flags}
  -UOTA_FOLDER_SERIAL
  -D OTA_SUPERSEEDER
  -D OTA_SUPERSEEDER_QSPI
  -D ADVERT_NAME='"SenseCap P1-Pro Superseeder"'
lib_deps =
  ${env:SenseCap_Solar_repeater_slim.lib_deps}

[env:SenseCap_Solar_room_server]
extends = SenseCap_Solar
build_flags =
  ${SenseCap_Solar.build_flags}
  -D ADVERT_NAME='"SenseCap_Solar Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${SenseCap_Solar.build_src_filter}
  +<../examples/simple_room_server/*.cpp>

[env:SenseCap_Solar_companion_radio_ble]
extends = SenseCap_Solar
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${SenseCap_Solar.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${SenseCap_Solar.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${SenseCap_Solar.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:SenseCap_Solar_companion_radio_usb]
extends = SenseCap_Solar
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${SenseCap_Solar.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${SenseCap_Solar.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${SenseCap_Solar.lib_deps}
  densaugeo/base64 @ ~1.4.0
