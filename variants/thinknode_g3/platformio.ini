[ThinkNode_G3]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
build_flags =
  ${esp32_base.build_flags}
  -I variants/thinknode_g3
  -D ELECROW_THINKNODE_G3
  -D P_LORA_NSS=39
  -D P_LORA_SCLK=42
  -D P_LORA_MOSI=40
  -D P_LORA_MISO=41
  -D P_LORA_RESET=21
  -D P_LORA_BUSY=47
  -D P_LORA_DIO_1=15
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_USER_BTN=4
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=3.0
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/thinknode_g3>
lib_deps =
  ${esp32_base.lib_deps}

[env:ThinkNode_G3_repeater]
extends = ThinkNode_G3
build_flags =
  ${ThinkNode_G3.build_flags}
  -D ADVERT_NAME='"ThinkNode G3 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ThinkNode_G3.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${ThinkNode_G3.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:ThinkNode_G3_room_server]
extends = ThinkNode_G3
build_flags =
  ${ThinkNode_G3.build_flags}
  -D ADVERT_NAME='"ThinkNode G3 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ThinkNode_G3.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${ThinkNode_G3.lib_deps}
  ${esp32_ota.lib_deps}

[env:ThinkNode_G3_companion_radio_ble]
extends = ThinkNode_G3
build_flags =
  ${ThinkNode_G3.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_WIFI_INTERFACE
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ThinkNode_G3.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/wifi/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ThinkNode_G3.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:ThinkNode_G3_companion_radio_usb]
extends = ThinkNode_G3
build_flags =
  ${ThinkNode_G3.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
  -D ENABLE_USB_INTERFACE
  -D ENABLE_WIFI_INTERFACE
build_src_filter = ${ThinkNode_G3.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/wifi/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ThinkNode_G3.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:ThinkNode_G3_companion_radio_wifi]
extends = ThinkNode_G3
build_flags =
  ${ThinkNode_G3.build_flags}
  -D ENABLE_WIFI_INTERFACE
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
  -D OFFLINE_QUEUE_SIZE=256
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ThinkNode_G3.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/wifi/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ThinkNode_G3.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:ThinkNode_G3_kiss_modem]
extends = ThinkNode_G3
build_src_filter = ${ThinkNode_G3.build_src_filter}
  +<../examples/kiss_modem/>
