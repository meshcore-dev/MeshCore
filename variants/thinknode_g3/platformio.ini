; Elecrow ThinkNode G3 (ILM13103D) — ESP32-S3-WROOM-1-N8R8 + LR1262 (SX1262)
;
; Drop this directory in as variants/thinknode_g3/ of a MeshCore checkout.
; MeshCore loads every variants/*/platformio.ini automatically.
;
; Radio map recovered from a stock Elecrow US915 flash dump (nsbradley88,
; meshtastic/firmware discussion #9434, 2026-09-23), then confirmed on air
; as a Meshtastic node with TCXO at 3.0 V. Not yet confirmed under MeshCore.
;
; Do not copy ThinkNode M7 pins. M7 is an LR1110 + different PCB.
; Ethernet is intentionally omitted: the CH390 SPI pins are not confirmed,
; and M7's ETH pins collide with this radio (BUSY is GPIO 47 here).

[ThinkNode_G3]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
upload_speed = 115200
; CH340 USB-UART, no auto-reset wiring. Hold BOOT, tap RST, release BOOT.
upload_flags =
  --before=no_reset
  --no-stub
build_flags = ${esp32_base.build_flags}
  -I variants/thinknode_g3
  -D THINKNODE_G3
  -D BOARD_HAS_PSRAM
  ; Radio — stock firmware tables @ 0x38244 / 0x3826c
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_NSS=39
  -D P_LORA_SCLK=42
  -D P_LORA_MOSI=40
  -D P_LORA_MISO=41
  -D P_LORA_RESET=21
  -D P_LORA_BUSY=47
  -D P_LORA_DIO_1=15
  -D P_LORA_EN=45
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=3.0
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  ; Front panel. Reload = GPIO 4, LINK LED = 5, LoRa LED = 6.
  -D PIN_USER_BTN=4
  -D PIN_STATUS_LED=5
  -D P_LORA_TX_LED=6
  -D LED_STATE_ON=HIGH
  ; I2C brought out in the early Meshtastic variant; unused by stock firmware.
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/thinknode_g3>

[env:ThinkNode_G3_repeater]
extends = ThinkNode_G3
build_src_filter = ${ThinkNode_G3.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${ThinkNode_G3.build_flags}
  -D ADVERT_NAME='"ThinkNode G3 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"#P@$sw0rd123456"'
  -D MAX_NEIGHBOURS=50
lib_deps =
  ${esp32_base.lib_deps}
  ${esp32_ota.lib_deps}

[env:ThinkNode_G3_room_server]
extends = ThinkNode_G3
build_src_filter = ${ThinkNode_G3.build_src_filter}
  +<../examples/simple_room_server>
build_flags =
  ${ThinkNode_G3.build_flags}
  -D ADVERT_NAME='"ThinkNode G3 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"#P@$sw0rd123456"'
  -D ROOM_PASSWORD='"hellno"'
lib_deps =
  ${esp32_base.lib_deps}
  ${esp32_ota.lib_deps}

[env:ThinkNode_G3_companion_radio_ble]
extends = ThinkNode_G3
build_flags =
  ${ThinkNode_G3.build_flags}
  -I examples/companion_radio/ui-orig
  -D DISPLAY_CLASS=NullDisplayDriver
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${ThinkNode_G3.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/NullDisplayDriver.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:ThinkNode_G3_companion_radio_usb]
extends = ThinkNode_G3
build_flags =
  ${ThinkNode_G3.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
build_src_filter = ${ThinkNode_G3.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
