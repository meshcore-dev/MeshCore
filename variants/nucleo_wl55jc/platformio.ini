[nucleo_wl55jc]
extends = stm32_base
board = nucleo_wl55jc
; The upstream board manifest tags the part as STM32WLE5xx even though its
; product_line is STM32WL55xx. Pin both to WL55 so a single device header and
; startup file (startup_stm32wl55xx_cm4.s) are in play.
board_build.extra_flags = -DSTM32WL -DSTM32WLxx -DSTM32WL55xx
board_upload.maximum_size = 229376 ; 32kb at the top of flash reserved for LittleFS
build_flags = ${stm32_base.build_flags}
  -D RADIO_CLASS=CustomSTM32WLx
  -D WRAPPER_CLASS=CustomSTM32WLxWrapper
  -D LORA_TX_POWER=22
  -D SPI_INTERFACES_COUNT=0
  -D RX_BOOSTED_GAIN=true
  -D STM32WL_TCXO_VOLTAGE=1.7
  -D P_LORA_TX_LED=LED_BLUE
  -D PIN_USER_BTN=USER_BTN
  -D USER_BTN_PRESSED=LOW
  -I variants/nucleo_wl55jc
build_src_filter = ${stm32_base.build_src_filter}
  +<../variants/nucleo_wl55jc>

[env:nucleo_wl55jc_repeater]
extends = nucleo_wl55jc
build_flags = ${nucleo_wl55jc.build_flags}
  -D ADVERT_NAME='"Nucleo WL55JC Repeater"'
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${nucleo_wl55jc.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

[env:nucleo_wl55jc_companion_radio_usb]
extends = nucleo_wl55jc
build_flags = ${nucleo_wl55jc.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D ENABLE_USB_INTERFACE   ; binds to Serial, i.e. the ST-LINK virtual COM port
build_src_filter = ${nucleo_wl55jc.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps = ${nucleo_wl55jc.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:nucleo_wl55jc_kiss_modem]
extends = nucleo_wl55jc
build_src_filter = ${nucleo_wl55jc.build_src_filter}
  +<../examples/kiss_modem/>

[env:nucleo_wl55jc_room_server]
extends = nucleo_wl55jc
build_flags = ${nucleo_wl55jc.build_flags}
  -D ADVERT_NAME='"Nucleo WL55JC Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${nucleo_wl55jc.build_src_filter}
  +<../examples/simple_room_server>
