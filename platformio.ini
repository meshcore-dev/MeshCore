; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
  variants/*/platformio.ini
  platformio.local.ini

[arduino_base]
framework = arduino
monitor_speed = 115200
lib_deps =
  SPI
  Wire
  ;jgromes/RadioLib @ ^7.7.1
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
  electroniccats/CayenneLPP @ 1.6.1
build_flags = -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D LORA_FREQ=927.875
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1   ; NOTE: comment these out for more secure firmware
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
build_src_filter =
  +<*.cpp>
  +<helpers/*.cpp>
  +<helpers/radiolib/*.cpp>
  +<helpers/bridges/BridgeBase.cpp>
  +<helpers/ui/MomentaryButton.cpp>

; ----------------- ESP32 ---------------------

[esp32_base]
extends = arduino_base
platform = platformio/espressif32@6.11.0
monitor_filters = esp32_exception_decoder
extra_scripts = merge-bin.py
build_flags = ${arduino_base.build_flags}
  -D ESP32_PLATFORM
;  -D ESP32_CPU_FREQ=80          ; change it to your need
build_src_filter = ${arduino_base.build_src_filter}

[esp32_ota]
lib_deps =
  ESP32Async/ESPAsyncWebServer @ 3.10.3
  file://arch/esp32/AsyncElegantOTA

; esp32c6 uses arduino framework 3.x
; WARNING: experimental. May not work as stable as other platforms.
[esp32c6_base]
extends = esp32_base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip

; empty by default; platformio.local.ini (untracked, see platformio.local.ini.template)
; overrides this same section to inject secrets like STOOP_CHANNEL_PSK, without
; having to redeclare (and thus replace) any env's own build_flags
[stoop_secrets]
build_flags =

; shared, board-agnostic pieces for building the stoop_radio example on any ESP32
; board -- referenced by [env:heltec_v4_stoop_radio] below. Don't need to touch
; this to switch boards.
[stoop_radio_base]
build_flags =
  ${stoop_secrets.build_flags}
  -I examples/stoop_net_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"Neighborhood Board (free)"'
  -D WIFI_PWD='""'
  -D STOOP_NODE_NAME='"stoop"'
  -D STOOP_MAX_CONNECTION_LENGTH=600000
  -D STOOP_MAX_CONNECTED_CLIENTS=8
  ; We don't want the legacy OTA web interface to build because it doens't work with the new UI
  -D DISABLE_WIFI_OTA=1
build_src_filter =
  +<helpers/esp32/*.cpp>
  +<../examples/stoop_net_radio/*.cpp>
  +<../examples/stoop_net_radio/ui-new/*.cpp>
lib_deps =
  densaugeo/base64 @ ~1.4.0
  ayushsharma82/ElegantOTA @ ^4.0.0
extra_scripts = pre:bin/embed_web.py
custom_web_dir = examples/stoop_net_radio/web

; the stoop_radio example, currently targeting the heltec_v4 board. To build it
; for a different ESP32 board instead, only the lines marked below need to change
; -- everything else comes from [stoop_radio_base] above and stays the same.
[env:heltec_v4_stoop_radio]
extends = heltec_v4_oled                      ; <-- CHANGE: that board's own display/radio base
build_flags =
  ${heltec_v4_oled.build_flags}                ; <-- CHANGE: match the line above
  ${stoop_radio_base.build_flags}
  -D DISPLAY_CLASS=SSD1306Display              ; <-- CHANGE: that board's display driver (omit if none)
extra_scripts = ${heltec_v4_oled.extra_scripts} ; <-- CHANGE: match the line above
  ${stoop_radio_base.extra_scripts}
custom_web_dir = ${stoop_radio_base.custom_web_dir}
build_src_filter = ${heltec_v4_oled.build_src_filter} ; <-- CHANGE: match the line above
  ${stoop_radio_base.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>             ; <-- CHANGE: that display driver's source (omit if none)
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${heltec_v4_oled.lib_deps}                    ; <-- CHANGE: match the line above
  ${stoop_radio_base.lib_deps}

; same firmware for the V4.3 hardware revision, which swaps the PA for a
; KCT8103L (per Heltec's wiki) and uses an ESP32-S3R8, so it needs the
; heltec_v4_r8 pin mapping. Units with an 8 MB flash chip also need
; board_upload.flash_size / board_build.partitions overrides -- see
; platformio.local.ini.
[env:heltec_v4_r8_stoop_radio]
extends = heltec_v4_r8_oled                   ; <-- CHANGE: that board's own display/radio base
build_flags =
  ${heltec_v4_r8_oled.build_flags}             ; <-- CHANGE: match the line above
  ${stoop_radio_base.build_flags}
  -D DISPLAY_CLASS=SSD1306Display              ; <-- CHANGE: that board's display driver (omit if none)
extra_scripts = ${heltec_v4_r8_oled.extra_scripts} ; <-- CHANGE: match the line above
  ${stoop_radio_base.extra_scripts}
custom_web_dir = ${stoop_radio_base.custom_web_dir}
build_src_filter = ${heltec_v4_r8_oled.build_src_filter} ; <-- CHANGE: match the line above
  ${stoop_radio_base.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>             ; <-- CHANGE: that display driver's source (omit if none)
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${heltec_v4_r8_oled.lib_deps}                ; <-- CHANGE: match the line above
  ${stoop_radio_base.lib_deps}

[env:stoop_dev]
extends = env:heltec_v4_stoop_radio
build_flags =
    ${env:heltec_v4_stoop_radio.build_flags}
    -D MESH_DEBUG=1
    -D WIFI_DEBUG_LOGGING=1
monitor_filters = esp32_exception_decoder, time
targets = upload, monitor

; ----------------- NRF52 ---------------------

[nrf52_base]
extends = arduino_base
platform = nordicnrf52
platform_packages =
  ; use internal fork that includes patch to ble stack to prevent firmware lockup during rapid connect/disconnect
  ; https://github.com/meshcore-dev/MeshCore/pull/1177
  ; https://github.com/meshcore-dev/MeshCore/pull/1295
  framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301
extra_scripts = create-uf2.py
build_flags = ${arduino_base.build_flags}
  -D NRF52_PLATFORM
  -D LFS_NO_ASSERT=1
  -D EXTRAFS=1
  -D USE_CC310_HW_CRYPTO=1
lib_deps =
  ${arduino_base.lib_deps}
  https://github.com/oltaco/CustomLFS#0.2.3
; ----------------- RP2040 ---------------------

[rp2040_base]
extends = arduino_base
upload_protocol = picotool
board_build.core = earlephilhower
platform = https://github.com/maxgerhardt/platform-raspberrypi.git   ; framework-arduinopico @ 1.50600.0+sha.6a1d13e9
build_flags = ${arduino_base.build_flags}
  -D RP2040_PLATFORM

; ----------------- STM32 ----------------------

[stm32_base]
extends = arduino_base
platform = ststm32
extra_scripts = post:arch/stm32/build_hex.py
build_flags = ${arduino_base.build_flags}
  -D STM32_PLATFORM
  -I src/helpers/stm32
  -I $PROJECT_PACKAGES_DIR/framework-arduinoststm32/libraries/SubGhz/src
build_src_filter = ${arduino_base.build_src_filter}
  +<helpers/stm32>
lib_deps = ${arduino_base.lib_deps}
  file://arch/stm32/Adafruit_LittleFS_stm32
  SubGhz

[sensor_base]
build_flags =
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_SHT4X=1
  -D ENV_INCLUDE_LPS22HB=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1
  -D ENV_INCLUDE_INA260=1
  -D ENV_INCLUDE_MLX90614=1
  -D ENV_INCLUDE_VL53L0X=1
  -D ENV_INCLUDE_BME680=1
  -D ENV_INCLUDE_BMP085=1
lib_deps =
  adafruit/Adafruit INA3221 Library @ ^1.0.1
  adafruit/Adafruit INA219 @ ^1.2.3
  robtillaart/INA226 @ ^0.6.4
  adafruit/Adafruit INA260 Library @ ^1.5.3
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library @ ^2.6.8
  adafruit/Adafruit SHTC3 Library @ ^1.0.1
  sensirion/Sensirion I2C SHT4x @ ^1.1.2
  arduino-libraries/Arduino_LPS22HB @ ^1.0.2
  adafruit/Adafruit MLX90614 Library @ ^2.1.5
  adafruit/Adafruit_VL53L0X @ ^1.2.4
  stevemarple/MicroNMEA @ ^2.0.6
  adafruit/Adafruit BME680 Library @ ^2.0.4
  adafruit/Adafruit BMP085 Library @ ^1.2.4

; ----------------- TESTING ---------------------

[env:native]
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I src
  -I test/mocks
test_build_src = yes
test_ignore = test_kiss_modem
build_src_filter =
  -<*>
  +<../src/Utils.cpp>
  +<../src/Packet.cpp>
  +<../src/helpers/ConfigSerializer.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_kiss_modem]
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I test/mocks
  -I src
  -I examples/kiss_modem
test_build_src = yes
test_filter = test_kiss_modem
build_src_filter =
  -<*>
  +<../examples/kiss_modem/KissModem.cpp>
lib_deps =
  google/googletest @ 1.17.0
