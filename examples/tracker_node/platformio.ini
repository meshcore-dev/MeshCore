; Kestrel TrackerMesh — standalone build config
; Run from repo root:
;   pio run -e heltec_tracker_v2_tracker -d examples/tracker_node
;   pio run -e t1000e_tracker            -d examples/tracker_node

[platformio]
extra_configs =
    ../../platformio.ini
    ../../variants/heltec_tracker_v2/platformio.ini
    ../../variants/t1000-e/platformio.ini

; ---- Heltec Tracker V2 (ESP32, GPS + TFT, dev target) ----
[env:heltec_tracker_v2_tracker]
extends = Heltec_tracker_v2
build_flags =
    ${Heltec_tracker_v2.build_flags}
    -D DISPLAY_CLASS=ST7735Display
    -D ADVERT_NAME='"KestrelTracker"'
    -D MAX_GROUP_CHANNELS=4
    -D MAX_CONTACTS=32
build_src_filter =
    ${Heltec_tracker_v2.build_src_filter}
    +<helpers/ui/ST7735Display.cpp>
    +<helpers/KestrelPLI.h>
    +<../examples/tracker_node/*.cpp>
lib_deps =
    ${Heltec_tracker_v2.lib_deps}
    stevemarple/MicroNMEA @ ^2.0.6

; ---- Seeed T1000-E (nRF52840, LR1110, production target) ----
; Boot state machine: 60s NFC/BLE provisioning window → tracker or relay mode.
; NFC tag emulation via nrfx_nfct; BLE NUS advertising as KSTRL-PROV.
[env:t1000e_tracker]
extends = t1000-e
build_flags =
    ${t1000-e.build_flags}
    -D ADVERT_NAME='"KestrelTracker"'
    -D MAX_GROUP_CHANNELS=4
    -D MAX_CONTACTS=32
    -D DISPLAY_CLASS=NullDisplayDriver
    -D NRF52_PLATFORM
build_src_filter =
    ${t1000-e.build_src_filter}
    +<helpers/nrf52/SerialBLEInterface.cpp>
    +<helpers/KestrelPLI.h>
    +<../examples/tracker_node/*.cpp>
lib_deps =
    ${t1000-e.lib_deps}
    stevemarple/MicroNMEA @ ^2.0.6
